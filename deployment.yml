--- 
apiVersion: apps/v1
kind: Deployment
metadata: 
  labels: 
    app: saraagentfrontend
  name: saraagentfrontend
  namespace: frontend
spec: 
  replicas: 2
  selector: 
    matchLabels: 
      app: saraagentfrontend
  template: 
    metadata: 
      labels: 
        app: saraagentfrontend
    spec: 
      containers: 
        - 
          image: "172.26.5.32:5000/saraagentfrontend:bank"
          imagePullPolicy: Always
          name: saraagentfrontend
          ports: 
            - 
              containerPort: 3000
      imagePullSecrets: 
        - 
          name: regcred
