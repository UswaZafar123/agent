--- 
apiVersion: apps/v1
kind: Deployment
metadata: 
  labels: 
    app: saraagentfrontend
  name: saraagentfrontend
  namespace: frontend
spec: 
  replicas: 2
  selector: 
    matchLabels: 
      app: saraagentfrontend
  template: 
    metadata: 
      labels: 
        app: saraagentfrontend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: saraagentfrontend 
      containers: 
        - 
          image: "registry.gitlab.com/business-intelligence-agency/saraagentfrontend:latest"
          name: saraagentfrontend
          resources:
            limits:
              memory: 2048Mi
            requests:
              memory: 1024Mi
          ports: 
            - 
              containerPort: 3000
      imagePullSecrets: 
        - 
          name: regcred
